# =====================================================================
# Traffic Accident Detection System - Default Pipeline Configuration
# =====================================================================

system:
  device: "cuda"          # "cuda" if torch.cuda.is_available() else "cpu"
  img_size: [640, 640]
  fps: 30
  log_level: "INFO"

detector:
  weights: "yolo11s.pt"   # Pretrained COCO or fine-tuned on Vietnam Traffic
  conf_threshold: 0.40    # Adjusted down for smaller vehicles (e.g. motorcycles)
  iou_threshold: 0.50     # NMS IoU threshold
  classes:                # Target class IDs (vehicle & pedestrian)
    - 0  # person
    - 1  # bicycle
    - 2  # car
    - 3  # motorcycle
    - 5  # bus
    - 7  # truck

tracker:
  type: "bytetrack"
  config_path: "configs/bytetrack_custom.yaml"
  track_buffer: 60        # Frames to keep lost tracks
  match_thresh: 0.8       # Hungarian matching threshold

features:
  max_history: 90         # Maximum frame trajectory history stored per track (~3 sec at 30 fps)
  smoothing_window: 5     # Moving average window size to denoise trajectory coordinates
  min_track_length: 10    # Minimum frames a track must exist before computing features

classifiers:
  rule_based:
    enabled: true
    sudden_decel_thresh: 2.0       # Pixel/frame^2 threshold for abnormal sudden stop (lowered from 15.0)
    direction_change_thresh: 25.0  # Degrees threshold for abnormal trajectory angle change (lowered from 45.0)
    iou_overlap_thresh: 0.05       # Sudden bounding box overlap between two vehicles (lowered from 0.15)
    distance_decrease_rate: 0.25   # Proportional distance reduction between pairs within 5 frames (lowered from 0.50)
    alert_threshold: 0.30          # Combined rule score required to trigger an alert (lowered from 0.50)

  lstm:
    enabled: false                 # Set to true once weights are trained
    weights: "checkpoints/lstm_trajectory_best.pt"
    input_dim: 15
    hidden_dim: 64
    num_layers: 2
    dropout: 0.3
    seq_len: 30
    threshold: 0.65

  visual_x3d:
    enabled: false                 # Cascade visual branch (X3D-S)
    weights: "checkpoints/x3d_s_accident_best.pt"
    cascade_threshold: 0.30        # Only trigger visual branch when motion_score > 0.30
    num_frames: 16
    crop_size: 160
    threshold: 0.70

fusion:
  method: "cascade"               # "cascade", "weighted", or "mlp"
  weights: "checkpoints/fusion_best.pt"
  motion_weight: 0.60
  visual_weight: 0.40
  final_threshold: 0.60

postprocessing:
  temporal_window: 10             # Number of frames in sliding window (widened from 5)
  min_consecutive_alerts: 2       # Require at least 2/10 frames positive to confirm alert (lowered from 3)
  nms_temporal_seconds: 3.0       # Merge alerts occurring within 3 seconds (widened from 2)
  cooldown_seconds: 2.0           # Cooldown window to prevent repeating alerts (lowered from 5)
  high_confidence_thresh: 0.70    # 🔴 Critical Accident Alert (lowered from 0.80)
  warning_thresh: 0.30            # 🟡 Potential Incident Warning (lowered from 0.50)