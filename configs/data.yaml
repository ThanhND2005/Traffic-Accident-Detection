# Dataset configuration for YOLO11 fine-tuning on Vietnam Traffic
path: datasets/vn_traffic  # dataset root dir (can be updated to Drive/Kaggle path)
train: images/train        # train images (relative to 'path')
val: images/val            # val images (relative to 'path')
test: images/test          # test images (optional)

# Classes
nc: 6
names:
  0: person
  1: bicycle
  2: car
  3: motorcycle
  4: bus
  5: truck